# This is a template used to create a complete manifest in the build
# directory. Doing so, it handles three tokens:
# @plugin_name
#    is replaced with PKG_NAME from Plugin.cmake
# @app_id
#    is  replaced with the last part of the initial id: line
#    after substituting possible @plugin_name.
# @include  <file>
#    Replaces the line with @include with the contents of <file>,
#
# See cmake/ConfigureManifest.cmake for details.
#
id: org.opencpn.OpenCPN.Plugin.@plugin_name

runtime: org.opencpn.OpenCPN
runtime-version: stable
sdk: org.freedesktop.Sdk//25.08
build-extension: true
separate-locales: false
appstream-compose: false
finish-args:
    - --socket=x11
    - --socket=pulseaudio
    - --filesystem=home
    - --device=all

modules:
    - @include opencpn-libs/flatpak/glu.yaml

    - @include libs/flatpak/libusb-compat-0.1.yaml

    - name: autoconf-archive
      buildsystem: autotools
      make-args:
        - PREFIX=/app
      make-install-args:
        - DESTDIR=/app/extensions/o-charts_pi
      sources:
        - type: archive
          url: https://mirrors.dotsrc.org/gnu/autoconf-archive/autoconf-archive-2024.10.16.tar.xz
          sha256: 7bcd5d001916f3a50ed7436f4f700e3d2b1bade3ed803219c592d62502a57363

    - name: libmnl
      buildsystem: autotools
      config-opts:
        - --prefix=/app/extensions/o-charts_pi
      sources:
        - type: git
          url: https://github.com/justmirror/libmnl.git
          tag: libmnl-1.0.4

    - name: json-c
      buildsystem: cmake
      config-opts:
        - -DCMAKE_INSTALL_PREFIX=/app/extensions/o-charts_pi
        - -DCMAKE_INSTALL_LIBDIR=lib
      sources:
        - type: git
          url: https://github.com/json-c/json-c
          tag: json-c-0.19-20260627

    - name: tpm2-tss
      buildsystem: autotools
      config-opts:
        -  --disable-static
        -  --enable-shared
        -  --without-udevrulesdir
        -  --with-tctidefaultconfig=/dev/tpmrm0
        -  --with-tctidefaultmodule=libtss2-tcti-device.so
        -  --prefix=/app/extensions/o-charts_pi
      build-options:
        cflags: -Wno-calloc-transposed-args -Wno-error=discarded-qualifiers
      sources:
        - type: git
          url:  https://github.com/tpm2-software/tpm2-tss.git
          tag: 4.1.3
          commit: 30e6057722058cb85c292dcb7b77760ad6410d4e
        - type: patch
          paths:
            - ../flatpak/0001-tpm2-tss-autoconf-Remove-irrelevant-tools-test.patch
            - ../flatpak/0003-Ignore-new-gcc-15-diagnostics.patch
            - ../flatpak/0004-configure.ac-Set-JSONC_LIBS-and-JSONC_CFLAGS.patch
        - type: file
          path: ../flatpak/autogen.sh
      cleanup:
        - /include
        - /lib/*.a
        - /lib/*.la
        - /lib/pkgconfig
        - /lib/libtss2-rc*

    - name: glew
      no-autogen: true
      make-args:
        - GLEW_PREFIX=/app/extensions/o-charts_pi
        - GLEW_DEST=/app/extensions/o-charts_pi
        - LIBDIR=/app/extensions/o-charts_pi/lib
      make-install-args:
        - GLEW_PREFIX=/app/extensions/o-charts_pi
        - GLEW_DEST=/app/extensions/o-charts_pi
        - LIBDIR=/app/extensions/o-charts_pi/lib
      sources:
        - type: archive
          url: https://downloads.sourceforge.net/project/glew/glew/2.1.0/glew-2.1.0.tgz
          sha256: 04de91e7e6763039bc11940095cd9c7f880baba82196a7765f727ac05a993c95
      cleanup:
        - /include
        - /lib/pkgconfig
        - /lib/*.a

    - name: iproute2
      sources:
        - type: archive
          url: https://mirrors.edge.kernel.org/pub/linux/utils/net/iproute2/iproute2-6.9.0.tar.xz
          sha256: 2f643d09ea11a4a2a043c92e2b469b5f73228cbf241ae806760296ed0ec413d0
      no-autogen: true
      buildsystem: autotools
      make-args:
        - PREFIX=/app
      make-install-args:
        - DESTDIR=/app/extensions/o-charts_pi
        - SBINDIR=/bin

    - name: @app_id
      no-autogen: true
      buildsystem: cmake
      config-opts:
          - -DCMAKE_INSTALL_PREFIX=/app/extensions/@app_id
          - -DCMAKE_BUILD_TYPE:STRING=Release
          - -DCMAKE_VERBOSE_MAKEFILE:BOOL=ON
          - -DBUILD_TYPE:STRING=tarball
          - -Uplugin_target
      build-options:
          cxxflags: -DFLATPAK -O3
          cflags: -DFLATPAK -O3
          # The flatpak-builder default CFLAGS adds -g

          # env:
          #    CMAKE_BUILD_PARALLEL_LEVEL: 1
      sources:
          - type: git
            url: ..
            branch: HEAD
